name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck jq bubblewrap
          # Hosted Ubuntu can restrict unprivileged user namespaces with AppArmor.
          # This is a disposable CI VM; the actual bwrap probes still must pass.
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install macOS tools
        if: runner.os == 'macOS'
        run: brew install bats-core shellcheck jq
      - run: make check
      - name: P0 regression mutations
        run: python3 tests/run-p0-mutants.py "$PWD" "$RUNNER_TEMP/p0-evidence" "$RUNNER_TEMP/p0-patches"
      - name: Training ground
        run: bash scripts/training-ground.sh "$RUNNER_TEMP/autopilot-training"
      - name: Verify training evidence
        run: bash scripts/verify-evidence.sh "$RUNNER_TEMP/autopilot-training/repo/evidence"
